[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Arc Testnet RPC
[rpc_endpoints]
arc = "https://rpc.testnet.arc-node.thecanteenapp.com/v1/${RPC_KEY}"

[etherscan]
arc = { key = "${ARCSCAN_KEY}", url = "https://testnet.arcscan.app/api" }
